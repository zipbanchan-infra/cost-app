<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>비용관리</title>
<style>
:root{--bg:#f4f5f8;--card:#fff;--t1:#191f28;--t2:#4e5968;--line:#e5e8eb;--pri:#1b4332;--up:#c92a2a;--dn:#1864ab}
@media (prefers-color-scheme:dark){:root{--bg:#14161a;--card:#1d2026;--t1:#f2f4f6;--t2:#a9b1bb;--line:#2d323a;--pri:#74c69d;--up:#ff8787;--dn:#74c0fc}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t1);font:14px/1.5 -apple-system,"Pretendard","Malgun Gothic",sans-serif}
header{display:flex;gap:12px;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-size:18px;margin:0 8px 0 0}main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
button,select,input,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
button.tab.on{background:var(--pri);color:#fff;border-color:var(--pri)}
table{border-collapse:collapse;width:100%}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child,td.l,th.l{text-align:left}tr.click{cursor:pointer}tr.click:hover{background:var(--bg)}
.up{color:var(--up)}.dn{color:var(--dn)}.mut{color:var(--t2)}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.k{display:flex;gap:24px;flex-wrap:wrap}.k div{min-width:150px}.k b{display:block;font-size:20px}
.err{color:var(--up)}.tag{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-left:6px}
.scroll{overflow:auto}.warn{border-color:#f08c00;background:rgba(240,140,0,.12)}.bar{display:inline-block;height:10px;border-radius:3px}.bu{background:var(--up)}.bd{background:var(--dn)}.heat td.hc{text-align:right;min-width:56px}.foot{font-size:12px;margin:8px 0 32px}.spark{color:var(--pri)}
</style></head>
<body>
<header><h1>비용관리</h1><span id="who" class="mut"></span><button id="login" class="pri">구글로 로그인</button></header>
<main id="main"><div class="card">로그인하면 보실 수 있는 본부의 비용이 나와요. 권한은 구글 시트 공유 설정을 따라요.</div></main>
<script src="calc.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="app.js"></script>
</body></html>
